<!DOCTYPE html><html lang="ku" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JS - KURDCODE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0a0a0f;color:white;line-height:1.8}header{padding:20px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #222}.logo{font-weight:900;color:#6C5CE7;text-decoration:none;font-size:24px}main{max-width:800px;margin:0 auto;padding:40px 20px}.box{background:#14141f;border:1px solid #222;border-radius:12px;padding:20px;margin:20px 0}.code{background:#0f0f1a;border:1px solid #333;border-radius:8px;padding:15px;direction:ltr;text-align:left;margin:15px 0}.editor{display:grid;grid-template-columns:1fr 1fr;gap:15px}textarea{width:100%;height:220px;background:#0f0f1a;color:white;border:1px solid #333;border-radius:8px;padding:12px;font-family:monospace;direction:ltr}iframe{width:100%;height:220px;background:white;border-radius:8px} .btn{background:#6C5CE7;color:white;padding:10px 25px;border-radius:20px;text-decoration:none;display:inline-block}</style></head><body>
<header><a href="index.html" class="logo">KURDCODE</a><a href="index.html" style="color:#aaa;text-decoration:none">← گەڕانەوە</a></header>
<main><h1>⚡ وانەی ٣: JavaScript</h1><p style="color:#888;margin-bottom:30px">وێبسایتەکەت جوڵێنە!</p>
<div class="box"><h3>JavaScript چی دەکات؟</h3><p>کلیک، جوڵە، نامە - هەموو کارلێکەکان بە JS دەکرێن.</p><div class="code">button.onclick = function(){<br>&nbsp;&nbsp;alert("سڵاو شاناز!");<br>}</div></div>
<div class="box"><h3>تاقی بکەرەوە - کلیک لە دوگمەکە بکە:</h3><div class="editor"><textarea id="code"><button onclick="alert('پیرۆزە! تۆ JS فێربوویت 🎉')" style="padding:15px 30px;background:#6C5CE7;color:white;border:none;border-radius:30px;font-size:18px;cursor:pointer">کلیکم لەسەر بکە</button></textarea><iframe id="preview"></iframe></div></div>
<a href="index.html" class="btn">← گەڕانەوە</a></main>
<script>const c=document.getElementById('code'),p=document.getElementById('preview');function u(){p.srcdoc=c.value}c.addEventListener('input',u);u();</script></body></html>
